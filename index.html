.frow{display:flex;align-items:center;gap:8px}
.frow .row{flex:1;min-width:0}
.fico{width:34px;height:26px;flex:none;border-radius:4px 7px 7px 7px;background:linear-gradient(180deg,var(--red-hi),var(--red));position:relative;margin-top:5px}
.fico::before{content:"";position:absolute;left:0;top:-5px;width:15px;height:7px;border-radius:4px 4px 0 0;background:var(--red-hi)}
.drow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 4px}
.drow .txt{flex:1 1 240px;min-width:0}
.drow .txt strong{overflow-wrap:anywhere}
.dact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dact select{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:4px 8px;font-size:.9rem;max-width:12em}
.ortrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.ortrow>label:first-child{flex:1 1 200px}
.ortrow .chk{padding-bottom:8px}
.chipbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.seg{display:flex;flex:none}
.seg button{border:1px solid var(--line);background:var(--raise);padding:5px 9px;font-size:.85rem;font-weight:600;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0} .seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"][data-v="a"]{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.seg button[aria-pressed="true"][data-v="e"]{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.seg button[aria-pressed="true"][data-v="f"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px -20px #000;background:var(--surface);color:var(--fg);padding:0;width:min(680px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,14,20,.6)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .sp{flex:1}
/* Anmeldung */
.login{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login form{grid-template-columns:1fr}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
#entwurfWrap:has(#entwurfNote[hidden]){display:none}#entwurfWrap{padding-top:14px}
#idleWarn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;background:var(--surface);border:1px solid var(--red-hi);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 16px 40px -10px #000;width:min(460px,calc(100% - 32px))}#idleWarn span{flex:1 1 200px}
#idleWarn[hidden]{display:none}
.pw{font-family:ui-monospace,Consolas,monospace;font-size:.95rem;letter-spacing:.02em;user-select:all}
.pwx{color:var(--muted);letter-spacing:.15em}
.ztab .pw,.pwfeld .pw{display:none}.ztab.zoffen .pw,.pwfeld.offen .pw{display:inline}.ztab.zoffen .pwx,.pwfeld.offen .pwx{display:none}
.pwfeld{display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.zrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 14px;padding:10px 14px}
.zrow .txt{display:flex;flex-direction:column;min-width:0}.zrow .pw{white-space:nowrap}
.tabletuser{display:flex;flex-wrap:wrap;gap:8px}
.tabletuser button[aria-pressed=true]{border-color:var(--red-hi);background:var(--raise)}
.syncst{font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}.syncst.warn{color:var(--warn)}.syncst.bad{color:var(--bad)}
.ghbox{display:grid;gap:10px}.ghbox input{font-family:ui-monospace,Consolas,monospace}
#areaBtn:disabled{cursor:default;opacity:1}#areaBtn:disabled .tri{display:none}
#toast{box-shadow:0 10px 30px -8px #000;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:in .15s ease-out}@keyframes in{from{opacity:.4;transform:translateY(8px)}}}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function feiertage(y){const o=easter(y),p=n=>{const d=new Date(o);d.setDate(d.getDate()+n);return iso(d)};
  return {[y+'-01-01']:'Neujahr',[y+'-01-06']:'Heilige Drei Könige',[p(-2)]:'Karfreitag',[p(1)]:'Ostermontag',[y+'-05-01']:'Tag der Arbeit',[p(39)]:'Christi Himmelfahrt',[p(50)]:'Pfingstmontag',[p(60)]:'Fronleichnam',[y+'-08-15']:'Mariä Himmelfahrt',[y+'-10-03']:'Tag der Deutschen Einheit',[y+'-11-01']:'Allerheiligen',[y+'-12-25']:'1. Weihnachtstag',[y+'-12-26']:'2. Weihnachtstag'}}

/* --- Hilfsfunktionen Kryptografie --- */
const te=new TextEncoder(), td=new TextDecoder();
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const kcache=new Map();
async function newKey(){return b64(rnd(32))}
async function imp(k){if(!kcache.has(k))kcache.set(k,await crypto.subtle.importKey('raw',unb64(k),'AES-GCM',false,['encrypt','decrypt']));return kcache.get(k)}
/* Vor dem Verschlüsseln packen (gzip): spart Platz bei GitHub, weil jede Änderung als Version erhalten bleibt */
const ZIP=typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined';
const strom=async(bytes,s)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(s)).arrayBuffer());
async function enc(k,obj){const iv=rnd(12);let d=te.encode(JSON.stringify(obj));if(ZIP)d=await strom(d,new CompressionStream('gzip'));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await imp(k),d);return ZIP?{iv:b64(iv),ct:b64(ct),z:1}:{iv:b64(iv),ct:b64(ct)}}
async function dec(k,box){let d=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},await imp(k),unb64(box.ct)));
  if(box.z){if(!ZIP)throw new Error('Dieser Browser ist zu alt für die App. Bitte aktualisieren.');d=await strom(d,new DecompressionStream('gzip'))}return JSON.parse(td.decode(d))}
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrap(pw,bundle){const salt=b64(rnd(16)),iv=rnd(12),k=await pwKey(pw,salt);
  return {salt,iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(bundle))))}}
async function unwrap(pw,u){const k=await pwKey(pw,u.salt);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(u.iv)},k,unb64(u.ct))))}
const normName=s=>String(s||'').toLowerCase().normalize('NFC').replace(/\s+/g,' ').trim();
async function nameHash(n){return b64(await crypto.subtle.digest('SHA-256',te.encode('ffw-glosberg|'+normName(n))))}

/* Speichern: jeder schreibt nur die Teile, für die er den Schlüssel hat */
function save(){if(!SESS)return;const snap=JSON.stringify(S);return inQ(()=>doSave(snap).catch(e=>{console.error(e);toast('Speichern fehlgeschlagen')}))}
async function doSave(snap){const st=getStore(),K=SESS.keys,r=role();st.pending=st.pending||[];
  const darf=n=>!st.blobs[n]||geladen.has(n)||blobCache[n]!==undefined; /* Teile, die dieses Gerät nie gelesen hat, nicht überschreiben */
  const put=async(name,key,obj)=>{const j=JSON.stringify(obj);if(blobCache[name]===undefined&&st.blobs[name]){try{blobCache[name]=JSON.stringify(await dec(key,st.blobs[name]))}catch(e){blobCache[name]=''}}if(blobCache[name]===j&&st.blobs[name])return;st.blobs[name]=await enc(key,obj);blobCache[name]=j;if(!st.pending.includes(name))st.pending.push(name)};
  if(r==='kdt'){await put('kdt',K.kdt,partKdt(JSON.parse(snap)));await put('tech',K.tech,partTech());await put('mann',K.mann,partMann());await put('gl',K.mann,partGl());
    for(const m of S.members){const pk=(S.sec.pkeys||{})[m.id];if(pk)await put('p_'+m.id,pk,partPers(m))}}
  else if(r==='gw'||r==='tablet'){const old=st.blobs.tech?await dec(K.tech,st.blobs.tech):{};
    await put('tech',K.tech,Object.assign(old,{geraete:S.geraete,maengel:S.maengel,fahrzeuge:S.fahrzeuge,rcinfo:S.rcinfo||{},lager:S.lager,aufgaben:(S.aufgaben||[]).filter(a=>a.area==='tech'),fk:Object.assign({},old.fk,bildFk())}));if(K.mann)await put('gl',K.mann,partGl())}
  if(K.jf&&K.jfm&&S.jugend&&darf('jf')){await put('jf',K.jf,partJf());await put('jfm',K.jfm,partJfm());
    for(const m of JW().members){const pk=(JW().sec.pkeys||{})[m.id];if(pk)await put('p_'+m.id,pk,partJPers(m))}}
  if(K.kf&&S.kinder&&darf('kf'))await put('kf',K.kf,partKf());
  if(K.verein&&darf('verein')){await put('verein',K.verein,partVerein());if(K.mann)await put('vm',K.mann,{events:vmEvents()})}
  putStore(st);if(SESS.gh)syncPlanen(1500)}

let umbau=false;

async function openData(sess){const st=getStore(),B=st.blobs;blobCache={};geladen=new Set();
  const get=async(n,k)=>{if(!B[n]||!k)return null;try{const o=await dec(k,B[n]);geladen.add(n);return o}catch(e){throw new Error('Die Zugangsdaten wurden geändert. Bitte neu anmelden.')}};

/* ================= Abgleich über GitHub =================
   Öffentliches App-Repository: index.html und zugang.json (Zugänge, nur mit Passwort zu öffnen)
   Privates Daten-Repository:   daten/<teil>.json (verschlüsselt) und dateien/<id> (Bilder und Dokumente, verschlüsselt)
   Jedes Gerät hält eine Kopie im Browser. Änderungen gehen sofort in die Kopie und werden dann hochgeladen.
   Haben zwei Geräte gleichzeitig geändert, werden die Stände Eintrag für Eintrag zusammengeführt. */
const GH0={owner:'michaelglosch26',app:'feuerwehr-glosberg',daten:'feuerwehr-daten',branch:'main'};
const ghCfg=()=>Object.assign({},GH0,getStore().cfg||{});
const J=JSON.stringify;

const inQ=fn=>(Q=Q.then(fn,fn));
async function gh(tok,path,opt={}){
  const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(tok)h.Authorization='Bearer '+tok;if(opt.body)h['Content-Type']='application/json';
  const r=await fetch(path.startsWith('http')?path:'https://api.github.com'+path,Object.assign({cache:'no-store'},opt,{headers:Object.assign(h,opt.headers||{})}));
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;try{e.msg=(await r.json()).message}catch(x){}throw e}
  return r.status===204?null:(opt.raw?r.text():r.json())}
const gh_=(t,p)=>gh(t,p);
const ghTxt=s=>{const b=unb64(s.replace(/\s/g,''));return td.decode(b)};
async function gitSha(txt){const b=te.encode(txt),h=te.encode('blob '+b.length+'\0'),a=new Uint8Array(h.length+b.length);a.set(h);a.set(b,h.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* Ein Commit mit mehreren Dateien. null als Inhalt löscht. Gibt null zurück, wenn ein anderes Gerät schneller war. */
async function ghCommit(tok,repo,files,msg){const c=ghCfg(),base=`/repos/${c.owner}/${repo}`;let ref;
  try{ref=await gh(tok,`${base}/git/ref/heads/${c.branch}`)}
  catch(e){if(e.status!==409&&e.status!==404)throw e; /* leeres Repository: erste Datei anlegen */
    await gh(tok,`${base}/contents/README.md`,{method:'PUT',body:J({message:'Start',content:btoa('Feuerwehr Glosberg\n'),branch:c.branch})});ref=await gh(tok,`${base}/git/ref/heads/${c.branch}`)}
  const head=ref.object.sha,com=await gh(tok,`${base}/git/commits/${head}`);
  const tree=await gh(tok,`${base}/git/trees`,{method:'POST',body:J({base_tree:com.tree.sha,tree:Object.entries(files).map(([path,content])=>content===null?{path,mode:'100644',type:'blob',sha:null}:{path,mode:'100644',type:'blob',content})})});
  const nc=await gh(tok,`${base}/git/commits`,{method:'POST',body:J({message:msg,tree:tree.sha,parents:[head]})});
  try{await gh(tok,`${base}/git/refs/heads/${c.branch}`,{method:'PATCH',body:J({sha:nc.sha})})}catch(e){if(e.status===422)return null;throw e}
  return nc.sha}

/* Drei-Wege-Zusammenführung: Basis b, lokaler Stand l, entfernter Stand r */
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x),idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!==undefined);
function m3(b,l,r){if(J(l)===J(r))return l;if(J(l)===J(b))return r;if(J(r)===J(b))return l;
  if(idArr(l)&&idArr(r)){const B=new Map((idArr(b)?b:[]).map(x=>[x.id,x])),L=new Map(l.map(x=>[x.id,x])),R=new Map(r.map(x=>[x.id,x])),out=[];
    for(const id of [...new Set([...l.map(x=>x.id),...r.map(x=>x.id)])]){const inB=B.has(id),inL=L.has(id),inR=R.has(id);
      if(inL&&inR)out.push(m3(B.get(id),L.get(id),R.get(id)));
      else if(inL){if(!(inB&&J(L.get(id))===J(B.get(id))))out.push(L.get(id))}
      else if(!(inB&&J(R.get(id))===J(B.get(id))))out.push(R.get(id))}
    return out}
  if(isObj(l)&&isObj(r)){const o={},bb=isObj(b)?b:{};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const inB=k in bb,inL=k in l,inR=k in r;
      if(inL&&inR)o[k]=m3(bb[k],l[k],r[k]);
      else if(inL){if(!(inB&&J(l[k])===J(bb[k])))o[k]=l[k]}
      else if(!(inB&&J(r[k])===J(bb[k])))o[k]=r[k]}
    return o}
  return l} /* beide haben denselben Wert verschieden geändert: der eigene gewinnt */

/* Welche Teile darf diese Sitzung lesen, und mit welchem Schlüssel */
function teilKey(n){const K=SESS.keys;
  /* Kommandanten laden den Teil der Kinderfeuerwehr nur verschlüsselt mit, damit er beim Schlüsselwechsel neu verschlüsselt werden kann */
  if(n==='kf'&&!K.kf&&SESS.role==='kdt'&&S&&S.sec)return S.sec.keys.kf||'';
  if(ALLKEYS.includes(n))return K[n]||'';if(n==='vm'||n==='gl')return K.mann||'';
  if(n.startsWith('p_')){const mid=n.slice(2);if(mid===SESS.mid)return SESS.p||'';if(!S)return '';
    return (SESS.role==='kdt'&&S.sec?(S.sec.pkeys||{})[mid]:'')||(K.jf&&S.jugend&&S.jugend.sec?(S.jugend.sec.pkeys||{})[mid]:'')||''}return ''}

let syncFehler=0, nachDialog=false;
function syncAnzeige(t,cls){const el=$('#syncSt');if(!el)return;el.hidden=!t;el.textContent=t||'';el.className='syncst'+(cls?' '+cls:'')}
/* Holt fremde Änderungen, führt zusammen und lädt eigene hoch */
function sync(){if(!SESS||!SESS.gh)return Promise.resolve();return inQ(syncJetzt)}
async function syncJetzt(){if(!SESS||!SESS.gh)return;const c=ghCfg(),tok=SESS.gh,base=`/repos/${c.owner}/${c.daten}`;let neuGeladen=false,zusammen=false;
  try{for(let runde=0;runde<5;runde++){const st=getStore();st.sha=st.sha||{};st.basis=st.basis||{};st.pending=st.pending||[];st.fpending=st.fpending||[];st.fsha=st.fsha||{};st.remNames=st.remNames||[];
    let head='';try{head=(await gh(tok,`${base}/git/ref/heads/${c.branch}`)).object.sha}catch(e){if(e.status!==409&&e.status!==404)throw e}
    if(head&&head!==st.head){const tree=await gh(tok,`${base}/git/trees/${head}?recursive=1`),rem={};st.fsha={};
      tree.tree.forEach(t=>{let m=t.path.match(/^daten\/(.+)\.json$/);if(m)rem[m[1]]=t.sha;m=t.path.match(/^dateien\/(.+)$/);if(m)st.fsha[m[1]]=t.sha});st.remNames=Object.keys(rem);
      for(const n of Object.keys(rem)){if(rem[n]===st.sha[n]||!teilKey(n))continue;
        const box=JSON.parse(ghTxt((await gh(tok,`${base}/git/blobs/${rem[n]}`)).content));
        if(st.pending.includes(n)&&st.blobs[n]){try{const k=teilKey(n),bas=st.basis[n]?await dec(k,st.basis[n]):{};st.blobs[n]=await enc(k,m3(bas,await dec(k,st.blobs[n]),await dec(k,box)));zusammen=true}catch(e){/* nicht lesbar: eigener Stand gewinnt */}}
        else{st.blobs[n]=box;neuGeladen=true}
        st.basis[n]=box;st.sha[n]=rem[n]}

    if(!st.pending.length&&!st.fpending.length){putStore(st,true);break}
    /* Hochladen */
    const files={},up=[...st.pending],fup=[];
    for(const n of up)files['daten/'+n+'.json']=st.blobs[n]?J(st.blobs[n]):(st.sha[n]||st.remNames.includes(n)?null:undefined);
    for(const n of up)if(files['daten/'+n+'.json']===undefined)delete files['daten/'+n+'.json'];
    let groesse=0;for(const id of st.fpending){if(groesse>20e6)break;const t=await fileVerpacken(id);if(t){files['dateien/'+id]=t;groesse+=t.length}fup.push(id)}
    syncAnzeige('Speichert …');
    const neu=Object.keys(files).length?await ghCommit(tok,c.daten,files,'Änderung von '+SESS.name):head;
    if(neu===null){putStore(st,true);continue} /* anderes Gerät war schneller: nochmal holen und zusammenführen */
    for(const n of up){if(st.blobs[n]){st.basis[n]=st.blobs[n];st.sha[n]=await gitSha(J(st.blobs[n]));if(!st.remNames.includes(n))st.remNames.push(n)}else{delete st.sha[n];delete st.basis[n];st.remNames=st.remNames.filter(x=>x!==n)}}
    for(const id of fup)if(files['dateien/'+id])st.fsha[id]=await gitSha(files['dateien/'+id]);
    st.pending=st.pending.filter(n=>!up.includes(n));st.fpending=st.fpending.filter(id=>!fup.includes(id));st.head=neu;putStore(st,true);
    if(!st.pending.length&&!st.fpending.length)break}
    await syncZugang();
    if(!SESS.ghz&&Date.now()-(syncJetzt.zug||0)>6e5){syncJetzt.zug=Date.now();await zugangLaden()}

    syncAnzeige(navigator.onLine===false?'Offline':'Nicht abgeglichen','warn');
    if(e.status===401||e.status===403)syncAnzeige('GitHub-Schlüssel ungültig','bad');
    if(syncFehler===1&&e.status!==undefined&&e.status!==0)toast('Abgleich mit GitHub fehlgeschlagen ('+(e.msg||e.message)+'). Die Daten bleiben auf dem Gerät und werden später hochgeladen.')}
  if(neuGeladen||zusammen){if($('#dlg').open)nachDialog=true;else await neuOeffnen(zusammen)}}

function gebBlock(list,wer){const h=new Date();h.setHours(0,0,0,0);const mit=list.filter(m=>m.geb),ohne=list.length-mit.length;

  const l=mit.map(m=>{const [gy,gm,gd]=m.geb.split('-').map(Number);let d=new Date(h.getFullYear(),gm-1,gd);
      if((d-h)/864e5<-7)d=new Date(h.getFullYear()+1,gm-1,gd);else if((d-h)/864e5>358)d=new Date(h.getFullYear()-1,gm-1,gd);
      return {m,d,tage:Math.round((d-h)/864e5),jahre:d.getFullYear()-gy}}).sort((a,b)=>a.tage-b.tage||nachSort(a.m,b.m));
  const nah=l.filter(x=>x.tage>=-7&&x.tage<=14),zeig=gebAlle?l:nah;
  const wann=x=>x.tage===0?'heute':x.tage===1?'morgen':x.tage===-1?'gestern':x.tage<0?'vor '+(-x.tage)+' Tagen':'in '+x.tage+' Tagen';
  const li=x=>`<li class="${x.tage===0?'gebheute':x.tage<0?'gebvorbei':''}"><div class="row"><span class="dt"><b>${pad(x.d.getDate())}</b><i>${MON[x.d.getMonth()].slice(0,3)}</i></span><span class="txt"><strong>${esc(x.m.name)}${x.tage===0?' 🎂':''}</strong><span class="muted small">${x.tage<0?'ist':'wird'} ${x.jahre} Jahre ${x.tage<0?'geworden':''} · ${wann(x)}</span></span></div></li>`;
  const knopf=`<button class="btn sm" data-act="geballe">${gebAlle?'Nur letzte Woche und nächste 2 Wochen':'Alle anzeigen ('+mit.length+')'}</button>`;
  return `<div class="head"><h2>Geburtstage</h2>${knopf}</div>${zeig.length?`<ul class="list panel">${zeig.map(li).join('')}</ul>`:`<p class="panel muted" style="margin:0">In der letzten Woche und den nächsten zwei Wochen hat niemand Geburtstag.</p>`}${gebAlle&&ohne?`<p class="muted small" style="margin:6px 2px 0">${ohne} ${wer} ohne Geburtsdatum. Es lässt sich bei der jeweiligen Person eintragen.</p>`:''}`}
function vStart(){const y=new Date().getFullYear(),t=today();
  const next=evs().filter(e=>evBis(e)>=t).slice(0,5);
  const ueb=evs('uebung',y).filter(e=>Object.keys(e.anw||{}).length);
  const act=aktiv();let sum=0;
  const rows=act.map(m=>{const um=ueb.filter(e=>fuerA(e,m)),a=um.filter(e=>e.anw[m.id]==='a').length,p=um.length?Math.round(a/um.length*100):0;sum+=p;return {m,um,a,p}})
    .sort((x,y)=>y.p-x.p||y.a-x.a||nachSort(x.m,y.m)).map(({m,um,a,p})=>{
    return `<tr><td>${esc(m.name)}</td><td class="num">${a} von ${um.length}</td><td class="num">${p} %</td><td><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join('');
  return `${S.sample?'<div class="note"><span><strong>Beispieldaten.</strong> Termine, Einsätze und Aufgaben sind erfunden, damit du die App ausprobieren kannst. Die Mannschaft ist echt und bleibt beim Entfernen erhalten.</span><button class="btn sm" data-act="clear">Beispieldaten entfernen</button></div>':''}
  <div class="stats"><div class="panel stat"><b>${evs('uebung',y).length}</b>Übungen ${y}</div><div class="panel stat"><b>${evs('einsatz',y).length}</b>Einsätze ${y}</div><div class="panel stat"><b>${act.length?Math.round(sum/act.length):0} %</b>Übungsbeteiligung</div><div class="panel stat"><b>${act.length}</b>Aktive</div><button class="panel stat statbtn${auOffen('kdt').length?' alarm':''}" data-act="tab" data-id="aufg"><b>${auOffen('kdt').length}</b>offene Aufgaben</button></div>
  <div class="head"><h2>Nächste Termine</h2><button class="btn pri" data-act="new" data-typ="uebung">Übung planen</button><button class="btn" data-act="new" data-typ="einsatz">Einsatz notieren</button></div>
  ${evList(next,'Keine kommenden Termine eingetragen.')}
  ${gebBlock(act,'Aktive')}
  <div class="head"><h2>Übungsbeteiligung ${y}</h2></div>
  ${rows?`<div class="panel scroll"><table><thead><tr><th>Name</th><th>Übungen</th><th>Quote</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="panel muted">Lege zuerst unter „Mannschaft“ deine Feuerwehrdienstleistenden an.</p>'}
  <div class="head"><h2>Daten</h2></div>
  <div class="panel"><p class="muted" style="margin-top:0">${(S.sec&&S.sec.gh||{}).d?'Die Daten werden verschlüsselt über GitHub zwischen allen Geräten abgeglichen. Zusätzlich kannst du eine Sicherung herunterladen.':'Die Daten liegen nur in diesem Browser auf diesem Gerät.'}</p><button class="btn" data-act="export">Datensicherung herunterladen</button></div>`}

function vPlan(){const ft=feiertage(year),t=today(),by={};
  S.events.forEach(e=>{const d=toD(e.datum),z=evBis(e);for(let i=0;i<40&&iso(d)<=z;i++){const k=iso(d);(by[k]=by[k]||[]).push(e);d.setDate(d.getDate()+1)}});
  let h='';for(let m=0;m<12;m++){const first=new Date(year,m,1),n=new Date(year,m+1,0).getDate(),off=(first.getDay()+6)%7;
    let c=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<span class="wd">${w}</span>`).join('')+'<span></span>'.repeat(off);
    for(let d=1;d<=n;d++){const s=year+'-'+pad(m+1)+'-'+pad(d),wd=new Date(year,m,d).getDay(),f=ferien(s),ev=by[s]||[];
      const cls=ft[s]?'feiertag':f?'ferien':(wd===0||wd===6)?'we':'';
      const tip=[ft[s],f,...ev.map(e=>TYP[e.typ]+': '+e.titel)].filter(Boolean).join(' · ');
      c+=`<button class="day ${cls}${ev.length?' ev ev-'+ev[0].typ:''}${s===t?' today':''}" data-act="day" data-id="${s}" title="${esc(tip)}" aria-label="${d}. ${MON[m]}${tip?', '+esc(tip):''}">${d}<span class="dots">${ev.slice(1,4).map(e=>`<i class="dot ${e.typ}"></i>`).join('')}</span></button>`}
    h+=`<section class="month"><h3>${MON[m]}</h3><div class="grid">${c}</div></section>`}
  return `<div class="head"><h2>Jahresplan</h2><div class="yearnav"><button class="btn" data-act="year" data-id="-1" aria-label="Vorjahr">‹</button><b>${year}</b><button class="btn" data-act="year" data-id="1" aria-label="Folgejahr">›</button></div><button class="btn" data-act="exp">Exportieren</button><button class="btn pri" data-act="new" data-typ="uebung">Termin anlegen</button></div>
  <div class="legend"><span><i class="sw" style="background:var(--feiertag)"></i>Feiertag in Bayern</span><span><i class="sw" style="background:var(--ferien)"></i>Schulferien</span>${Object.keys(TYP).map(k=>`<span><i class="dot ${k}"></i>${TYP[k]}</span>`).join('')}</div>
  ${FERIEN[year]?'':`<p class="note"><span>Für ${year} sind noch keine Schulferien hinterlegt. Die Feiertage sind berechnet.</span></p>`}
  <p class="muted small" style="margin:0">Tippe auf einen Tag, um Einträge zu sehen oder eine Übung zu planen.</p>
  <div class="months">${h}</div>`}

function vEvents(typ){const up=typ==='uebung';const l=evs(typ,year);if(!up)l.reverse();
  const extra=up?evs(null,year).filter(e=>e.typ!=='uebung'&&e.typ!=='einsatz'):[];
  return `<div class="head"><h2>${up?'Übungen':'Einsätze'}</h2><div class="yearnav"><button class="btn" data-act="year" data-id="-1" aria-label="Vorjahr">‹</button><b>${year}</b><button class="btn" data-act="year" data-id="1" aria-label="Folgejahr">›</button></div>
  <button class="btn pri" data-act="new" data-typ="${typ}">${up?'Übung planen':'Einsatz notieren'}</button>${up?'<button class="btn" data-act="new" data-typ="verein">Anderer Termin</button>':''}</div>
  ${evList(l,up?`Für ${year} sind noch keine Übungen geplant.`:`Für ${year} sind keine Einsätze notiert.`)}
  ${extra.length?`<div class="head"><h2>Weitere Termine</h2></div>${evList(extra,'')}`:''}`}

const alter=g=>{if(!g)return'';const d=toD(g),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const dmy=g=>{const d=toD(g);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
function vTeam(){const l=[...S.members].sort((a,b)=>(b.aktiv-a.aktiv)||nachSort(a,b));
  return `<div class="head"><h2>Mannschaft <span class="muted" style="font-size:1rem;font-weight:500">${aktiv().length} Aktive</span></h2><button class="btn" data-act="ics">Geburtstage in Kalender</button><button class="btn" data-act="zug">Zugänge</button><button class="btn pri" data-act="mnew">Person hinzufügen</button></div>
  ${l.length?`<ul class="list panel">${l.map(m=>`<li><button class="row" data-act="medit" data-id="${m.id}"><span class="txt"><strong class="nm">${esc(m.name)} ${fnBadges(m)}</strong>
   <span class="muted small">${esc([m.rang||'ohne Dienstgrad',m.geb?'geb. '+dmy(m.geb)+' ('+alter(m.geb)+' Jahre)':''].filter(Boolean).join(' · '))}</span>
   ${m.aktiv?'':'<span class="tags"><span class="tag termin">nicht aktiv</span></span>'}</span></button></li>`).join('')}</ul>`:'<p class="panel muted">Noch niemand angelegt.</p>'}
  <p class="muted small">Tippe auf eine Person, um ihre Lehrgänge zu sehen und die Angaben zu bearbeiten. Nicht aktive Personen bleiben in alten Anwesenheitslisten erhalten, erscheinen aber nicht mehr bei neuen Übungen.</p>`}
function dl(name,text,type){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([text],{type}));l.download=name;document.body.append(l);l.click();l.remove()}
function icsText(){const y=new Date().getFullYear(),n=new Date(),st=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+'00Z';
  const t=x=>String(x).replace(/[\\;,]/g,'\\$&');const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FF Glosberg//Geburtstage//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:FF Glosberg Geburtstage'];
  S.members.filter(m=>m.aktiv&&m.geb).forEach(m=>{const [gy,gm,gd]=m.geb.split('-'),e=new Date(y,+gm-1,+gd+1);
    L.push('BEGIN:VEVENT','UID:geb-'+m.id+'@ff-glosberg','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+y+gm+gd,'DTEND;VALUE=DATE:'+e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate()),'RRULE:FREQ=YEARLY','SUMMARY:'+t('Geburtstag '+m.name),'DESCRIPTION:'+t('Jahrgang '+gy+' · FF Glosberg'),'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t('Geburtstag '+m.name),'TRIGGER:PT8H','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n'}
/* ---------- Fahrberechtigung je Fahrzeug: Fahrerlaubnis (Führerscheinklasse) und Unterweisung (mit Datum) ---------- */
const istAnh=v=>/anhänger/i.test((v.typ||'')+' '+(v.name||''));
const feFz=()=>fzSortiert().filter(v=>!istAnh(v));
const feVon=(m,v)=>(m.fe||{})[v.id]||{};
const darfFahren=(m,v)=>{const f=feVon(m,v);return !!(f.fe&&f.unt)};
function feBlock(m){const l=feFz();if(!l.length)return '';
  return `<div><h3>Fahrberechtigung</h3><p class="muted small" style="margin:4px 0 6px">Fahren darf, wer für das Fahrzeug die Fahrerlaubnis hat und unterwiesen wurde.</p>
  <div class="panel fetab">${l.map(v=>{const f=feVon(m,v);return `<div class="ferow" data-v="${v.id}"><strong>${esc(v.name)}</strong>
   <label class="chk"><input type="checkbox" class="fe_fe"${f.fe?' checked':''}>Fahrerlaubnis</label>
   <label class="chk"><input type="checkbox" class="fe_unt"${f.unt?' checked':''}>Unterweisung</label>
   <input type="date" class="fe_dat" value="${esc(f.dat||'')}" aria-label="Datum der Unterweisung ${esc(v.name)}" title="Datum der Unterweisung"></div>`}).join('')}</div></div>`}
function readFe(m){const fe={};document.querySelectorAll('.ferow').forEach(r=>{const a=r.querySelector('.fe_fe').checked,u=r.querySelector('.fe_unt').checked,d=r.querySelector('.fe_dat').value;
  if(a||u||d)fe[r.dataset.v]={fe:a,unt:u||!!d,dat:d}});m.fe=fe}
const feText=f=>f.fe&&f.unt?'Darf fahren':f.fe?'Unterweisung fehlt':f.unt?'Fahrerlaubnis fehlt':'';
/* Fahrzeugansicht: wer darf fahren */
function fahrerBlock(v){if(istAnh(v))return '';const l=aktiv().filter(m=>feVon(m,v).fe||feVon(m,v).unt).sort(nachSort);if(!l.length)return `<p class="muted small" style="margin:0">Noch keine Fahrberechtigungen eingetragen (bei der Person unter „Fahrberechtigung“).</p>`;

function planPdf(J,y,list,logo,sub){const doc=new J({unit:'mm',format:'a4'}),L=15,R=195;let yy,x=L;

  const need=h=>{if(yy+h>281){doc.addPage();yy=18}};

    need(36);doc.setFillColor(235,236,239);doc.rect(L,yy,R-L,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20);doc.text(MON[m],L+2,yy+5);yy+=11;
    ml.forEach(e=>{const d=toD(e.datum);doc.setFontSize(10);doc.setFont('helvetica','bold');
      const tl=doc.splitTextToSize(clean(e.titel),72);doc.setFont('helvetica','normal');const ol=doc.splitTextToSize(clean(e.ort),44);
      const h=Math.max(tl.length*4.4+4,ol.length*4.4)+3.5;need(h);
      doc.setTextColor(20);doc.setFont('helvetica','bold');doc.text(evBis(e)!==e.datum?pad(d.getDate())+'.-'+kurz(e.bis):WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.',L+2,yy);
      doc.setFont('helvetica','normal');doc.text(e.zeit?e.zeit+(e.ende?'-'+e.ende:'')+' Uhr':'',L+24,yy);
      doc.setFont('helvetica','bold');doc.text(tl,L+58,yy);doc.setFont('helvetica','normal');doc.text(ol,L+135,yy);
      doc.setFontSize(8);doc.setTextColor(120);doc.text([TYP[e.typ],e.gruppe&&e.gruppe!=='alle'?'Gruppe: '+clean(e.gruppe):'',clean(e.kleid)].filter(Boolean).join(' · '),L+58,yy+tl.length*4.4);
      yy+=h;doc.setDrawColor(215);doc.setLineWidth(.15);doc.line(L,yy-3.6,R,yy-3.6)});
    yy+=3}
  {const kl=[...new Set(list.map(e=>e.kleid).filter(k=>KLEID[k]))];if(kl.length){doc.setFont('helvetica','normal');doc.setFontSize(8);const tx=doc.splitTextToSize(kl.map(k=>k+' = '+KLEID[k]).join(' · '),R-L);need(tx.length*3.6+4);doc.setTextColor(90);doc.text(tx,L,yy+2);yy+=tx.length*3.6+4}}
  const n=doc.getNumberOfPages(),t=new Date();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.setFont('helvetica','normal');
    doc.text('Stand: '+pad(t.getDate())+'.'+pad(t.getMonth()+1)+'.'+t.getFullYear()+' · Änderungen vorbehalten',L,290);doc.text('Seite '+i+' von '+n,R,290,{align:'right'})}
  return doc}

  else if(a==='xnew'){xdraft={id:uid(),gid:id||'',datum:today(),text:'',von:'',prio:'normal',erledigt:'',erl:''};mangelDlg()}
  else if(a==='xedit'){xdraft=JSON.parse(JSON.stringify(S.maengel.find(m=>m.id===id)));mangelDlg()}
  else if(a==='xsave'){const m=xdraft,v=i=>$('#'+i).value.trim();m.gid=v('x_gid');m.text=v('x_text');m.datum=v('x_datum')||today();m.von=v('x_von');m.prio=$('#x_prio').checked?'dringend':'normal';m.erledigt=v('x_erl');m.erl=v('x_erln');

const kfKopf=()=>`<div class="kfkopf"><img src="${KF_LOGO}" alt="Logo Gloschbercher Löschkids"><div><h2>Gloschbercher Löschkids</h2><div class="muted">Kinderfeuerwehr der FF Glosberg</div></div></div>`;
let kdraft=null;
function kQuote(k,y){const st=evs('kinder',y).filter(e=>e.datum<=today()&&Object.keys(e.anw||{}).length),a=st.filter(e=>e.anw[k.id]==='a').length;return {st,a,p:st.length?Math.round(a/st.length*100):0}}
function kBeteiligung(){const y=new Date().getFullYear(),l=[...KF().members].sort(nachSort),st=evs('kinder',y).filter(e=>e.datum<=today()&&Object.keys(e.anw||{}).length);
  const anz=e=>Object.values(e.anw).filter(v=>v==='a').length,avg=st.length?st.reduce((s,e)=>s+anz(e),0)/st.length:0;
  const rows=l.map(k=>({k,q:kQuote(k,y)})).sort((x,z)=>z.q.p-x.q.p||z.q.a-x.q.a||nachSort(x.k,z.k)).map(({k,q})=>{return `<tr><td>${esc(k.name)}<div class="muted small">${k.geb?alter(k.geb)+' Jahre':''}</div></td><td class="num">${q.a} von ${q.st.length}</td><td class="num">${q.p} %</td><td><div class="bar"><i style="width:${q.p}%"></i></div></td></tr>`}).join('');
  return `<div class="head"><h2>Beteiligung ${y}</h2></div>
  ${st.length&&rows?`<p class="muted small" style="margin:0">${st.length} Termin${st.length>1?'e':''} mit erfasster Teilnahme, im Schnitt ${avg.toFixed(1).replace('.',',')} Kinder je Termin.</p><div class="panel scroll"><table><thead><tr><th>Name</th><th>Termine</th><th>Quote</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="panel muted">Noch keine Teilnahme erfasst. Öffne einen vergangenen Termin und kreuze an, wer da war.</p>'}`}
function vKStart(){return kfKopf()+vKStart_()}
function vKStart_(){const t=today(),kom=evs('kinder').filter(e=>evBis(e)>=t),l=[...KF().members].sort(nachSort),mon=new Date().getMonth();
    return `<div class="stats"><button class="panel stat statbtn" data-act="tab" data-id="k_kinder"><b>${l.length}</b>Kinder</button><button class="panel stat statbtn" data-act="tab" data-id="k_term"><b>${kom.length}</b>kommende Termine</button><button class="panel stat statbtn" data-act="tab" data-id="k_docs"><b>${KF().docs.length}</b>Dokumente</button></div>
  <div class="head"><h2>Nächste Termine</h2>${kalKnoepfe('kinder',y=>evs('kinder',y))}<button class="btn" data-act="tab" data-id="k_term">Alle anzeigen</button><button class="btn pri" data-act="new" data-typ="kinder">Termin planen</button></div>
  ${evList(kom.slice(0,5),'Keine kommenden Termine eingetragen.')}
  ${gebBlock(l,'Kinder')}
  ${kBeteiligung()}
  <p class="muted small" style="margin:0">Diesen Bereich sehen nur die Leitung und die Betreuer/-innen der Kinderfeuerwehr sowie die Kommandant/-innen.</p>`}
function vKTerm(){
  return `<div class="head"><h2>Termine</h2>${yearNav()}<button class="btn" data-act="kal" data-id="kinder:${year}">Terminplan (PDF)</button><button class="btn" data-act="kics">Kalenderdatei</button><button class="btn pri" data-act="new" data-typ="kinder">Termin planen</button></div>
  ${evList(evs('kinder',year),`Für ${year} sind noch keine Termine geplant.`)}`}
function vKKinder(){const l=[...KF().members].sort(nachSort);
  return `<div class="head"><h2>Kinder <span class="muted" style="font-size:1rem;font-weight:500">${l.length}</span></h2><button class="btn pri" data-act="knew">Kind hinzufügen</button></div>
  ${l.length?`<ul class="list panel">${l.map(k=>`<li><button class="row" data-act="kedit" data-id="${k.id}"><span class="txt"><strong>${esc(k.name)}</strong><span class="muted small">${k.geb?'geb. '+dmy(k.geb)+' ('+alter(k.geb)+' Jahre)':'ohne Geburtsdatum'}${(q=>q.st.length?' · Beteiligung '+q.p+' %':'')(kQuote(k,new Date().getFullYear()))}</span></span></button></li>`).join('')}</ul>`:'<p class="panel muted">Noch keine Kinder angelegt.</p>'}
  <p class="muted small">Gespeichert werden nur Name und Geburtsdatum, verschlüsselt und nur für Leitung, Betreuer/-innen und Kommandant/-innen lesbar.</p>`}
function kDlg(){const k=kdraft,isNew=!KF().members.some(x=>x.id===k.id);
  openDlg(`<h2>${isNew?'Kind hinzufügen':'Kind'}</h2>
  <div class="f"><label class="wide">Vor- und Nachname<input id="k_name" value="${esc(k.name)}" autocomplete="off"></label><label>Geburtsdatum<input type="date" id="k_geb" value="${esc(k.geb||'')}"></label></div>
  <div class="err" id="formErr"></div>
  <div class="actions">${isNew?'':`<button class="btn danger" data-act="kdel" data-id="${k.id}">Löschen</button>`}<span class="sp"></span><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" data-act="ksave">Speichern</button></div>`)}
function vKDocs(){const l=[...KF().docs].sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  return `<div class="head"><h2>Dokumente</h2><label class="btn pri" for="k_up">Datei hinzufügen</label><input type="file" id="k_up" multiple hidden></div>
  <p class="muted small" style="margin:0">Nur für die Leitung und die Betreuer/-innen der Kinderfeuerwehr sowie die Kommandant/-innen.</p>
  ${l.length?`<ul class="list panel">${l.map(d=>`<li class="drow"><div class="txt"><strong>${esc(d.name)}</strong><div class="muted small">${kb(d.size)}${d.datum?' · '+dmy(d.datum):''}</div></div><div class="dact"><button class="btn sm" data-act="dopen" data-id="${d.id}">Öffnen</button><button class="btn sm danger" data-act="kddel" data-id="${d.id}">Löschen</button></div></li>`).join('')}</ul>`:'<p class="panel muted">Noch keine Dokumente.</p>'}`}
function kfAct(a,id,b){
  if(a==='knew'){kdraft={id:'k'+uid(),name:'',nach:'',geb:''};kDlg()}
  else if(a==='kedit'){kdraft=JSON.parse(JSON.stringify(KF().members.find(k=>k.id===id)));kDlg()}
  else if(a==='ksave'){const k=kdraft;k.name=$('#k_name').value.trim().replace(/\s+/g,' ');k.nach=k.name.split(' ').pop();k.geb=$('#k_geb').value;if(!k.name){$('#formErr').textContent='Bitte einen Namen eintragen.';return true}
    const i=KF().members.findIndex(x=>x.id===k.id);if(i<0)KF().members.push(k);else KF().members[i]=k;$('#dlg').close();done('Gespeichert')}
  else if(a==='kdel'){if(!armed(b))return true;KF().members=KF().members.filter(k=>k.id!==id);$('#dlg').close();done('Gelöscht')}
  else if(a==='kddel'){if(!armed(b))return true;KF().docs=KF().docs.filter(d=>d.id!==id);idbDo('readwrite',s=>s.delete(id)).catch(()=>{});done('Gelöscht')}

  else if(a==='fdel'){if(!armed(b))return;S.ordner=folders().filter(f=>f!==id);done('Ordner gelöscht')}
  else if(a==='dfrei'){const d=S.docs.find(d=>d.id===id);d.frei=!d.frei;done()}
  else if(a==='ddel'){if(!armed(b))return;S.docs=S.docs.filter(d=>d.id!==id);S.events.forEach(e=>{e.docs=(e.docs||[]).filter(x=>x!==id)});try{await idbDo('readwrite',s=>s.delete(id))}catch(e){}done('Gelöscht')}
  else if(a==='dopen'){try{toast('Wird geöffnet …');const blob=await idbDo('readonly',s=>s.get(id))||await fileHolen(id);if(!blob)throw 0;const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.target='_blank';l.rel='noopener';document.body.append(l);l.click();l.remove()}catch(e){toast('Die Datei ist auf diesem Gerät nicht vorhanden')}}

});

document.addEventListener('change',async ev=>{

  if(ev.target.id==='k_up'){let n=0;for(const f of ev.target.files){if(f.size>25*1048576){toast('„'+f.name+'“ ist größer als 25 MB und wurde nicht übernommen');continue}const id=uid();try{await idbDo('readwrite',s=>s.put(f,id));fileNeu(id);KF().docs.push({id,name:f.name,size:f.size,datum:today()});n++}catch(e){toast('„'+f.name+'“ konnte nicht gespeichert werden')}}if(n)done(n+' Datei'+(n>1?'en':'')+' hinzugefügt')}
  if(ev.target.id==='j_up'){let n=0;for(const f of ev.target.files){if(f.size>25*1048576){toast('„'+f.name+'“ ist größer als 25 MB und wurde nicht übernommen');continue}const id=uid();try{await idbDo('readwrite',s=>s.put(f,id));fileNeu(id);JW().docs.push({id,name:f.name,size:f.size,datum:today(),frei:true});n++}catch(e){toast('„'+f.name+'“ konnte nicht gespeichert werden')}}if(n)done(n+' Datei'+(n>1?'en':'')+' hinzugefügt')}
  if(ev.target.id==='upload'){let n=0;for(const f of ev.target.files){if(f.size>25*1048576){toast('„'+f.name+'“ ist größer als 25 MB und wurde nicht übernommen');continue}const id=uid();try{await idbDo('readwrite',s=>s.put(f,id));fileNeu(id);S.docs.push({id,name:f.name,size:f.size,datum:today(),frei:false,ordner:docPath});n++}catch(e){toast('„'+f.name+'“ konnte nicht gespeichert werden')}}
    if(n)done(n+' Datei'+(n>1?'en':'')+' hinzugefügt')}});
